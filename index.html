<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8F0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Quicksand: 圆润可爱的 UI 字体 | ZCOOL KuaiLe: 标题专用可爱字体(子集加载) | Noto Serif/Sans SC: 中文正文 -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <title>晚安宝宝 - AI 胎教助手</title>
  </head>
  <body>
    <script>
      // FOUC 防闪：在 React 挂载前根据偏好设置 .dark 类
      (function(){
        var p = localStorage.getItem('theme-preference');
        // 有明确偏好则直接使用，否则根据系统偏好和时间判断
        var dark = p === 'dark' || (!p && (
          window.matchMedia('(prefers-color-scheme: dark)').matches ||
          new Date().getHours() >= 18 || new Date().getHours() < 6
        ));
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
